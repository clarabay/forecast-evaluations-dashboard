name: Update precomputed scores

# Scores live in precomputed/ and go stale as hubs publish new forecast dates.
# Rebuilding here rather than in the app: the deployed container has an ephemeral
# filesystem and ~1 GB of memory, and cannot commit its results anywhere.
on:
  schedule:
    # Wednesdays and Fridays 13:30 UTC — after each NHSN release lands.
    - cron: "30 13 * * 3,5"
  workflow_dispatch:      # also runnable on demand from the Actions tab

permissions:
  contents: write         # needed to commit the regenerated parquet files

concurrency:
  group: update-scores
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Forecast CSVs are cached to ~/.flusight_cache as parquet. Restoring it
      # turns most of the run into local reads instead of thousands of downloads.
      # The key rotates weekly so the cache keeps growing rather than going stale.
      - name: Restore forecast cache
        uses: actions/cache@v4
        with:
          path: ~/.flusight_cache
          key: flusight-cache-${{ github.run_id }}
          restore-keys: |
            flusight-cache-

      - name: Rebuild scores
        env:
          # Lifts the API rate limit from 60/hour to 1000/hour for this repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # build_scores.py calls load_truth_data, which pulls CDC's preliminary
          # NHSN and NSSP feeds from Socrata. The runner is a separate
          # environment from both the laptop and Streamlit Cloud, so the token
          # has to be handed to it explicitly or sodapy falls back to anonymous
          # ("Requests made without an app_token will be subject to strict
          # throttling limits"). Unset is harmless — it just throttles.
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python scripts/build_scores.py

      - name: Commit if changed
        run: |
          set -uo pipefail
          if git diff --quiet -- precomputed/; then
            echo "No score changes — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The rebuild can run the best part of an hour, so the branch may have
          # moved since checkout and a bare push then fails as a non-fast-forward
          # (this is how the 2026-10-14 run was lost). Re-point the index at the
          # current remote tip each attempt and stage only precomputed/, so the
          # commit carries the new scores and nothing else, whatever else landed
          # meanwhile. The parquet files are derived artefacts rebuilt from
          # scratch here, so the freshly built ones always win.
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            git fetch origin "$branch"
            git reset --mixed "origin/$branch"
            git add precomputed/
            if git diff --cached --quiet; then
              echo "Scores already match origin/$branch — nothing to push."
              exit 0
            fi
            git commit -m "Update precomputed scores ($(date -u +%Y-%m-%d))"
            if git push origin "HEAD:$branch"; then
              echo "Pushed updated scores (attempt $attempt)."
              exit 0
            fi
            echo "Push rejected on attempt $attempt — the branch moved during the run; retrying."
            git reset --soft HEAD~1
          done
          echo "Could not push after 3 attempts." >&2
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Precomputed score files"
            echo ""
            echo '```'
            ls -la precomputed/ 2>/dev/null || echo "precomputed/ missing"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
